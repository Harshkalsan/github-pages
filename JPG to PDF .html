    <script>
        document.getElementById('convertBtn').addEventListener('click', async () => {
            const file = document.getElementById('pdfInput').files[0];
            const compression = parseFloat(document.getElementById('compression').value);
            
            if (!file) {
                alert('Please select a PDF file');
                return;
            }

            try {
                const pdfData = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;
                const zip = new JSZip();

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 2 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;

                    const imgData = canvas.toDataURL('image/jpeg', compression);
                    const base64Data = imgData.replace(/^data:image\/jpeg;base64,/, '');
                    zip.file(`page-${pageNum}.jpg`, base64Data, { base64: true });
                }

                const zipFile = await zip.generateAsync({ type: 'blob' });
                const downloadLink = URL.createObjectURL(zipFile);
                
                const a = document.createElement('a');
                a.href = downloadLink;
                a.download = 'converted-images.zip';
                a.click();
                
                URL.revokeObjectURL(downloadLink);

            } catch (error) {
                console.error('Conversion error:', error);
                alert('Error converting PDF: ' + error.message);
            }
        });
    </script>
